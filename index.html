<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnoscore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
          <div class="container-fluid">
            <!-- Logo aligned to the left -->
            <a class="navbar-brand me-auto" href="#">
              <img src="/api/placeholder/30/30" alt="Logo" class="d-inline-block align-text-top">
              Navbar
            </a>
      
            <!-- Navigation links centered -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
              <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
                <a class="nav-link" href="#">Features</a>
                <a class="nav-link" href="#">Pricing</a>
              </div>
            </div>
      
            <!-- Buttons aligned to the right -->
            <div class="d-flex align-items-center">
              <button class="btn btn-outline-secondary me-2" id="darkModeBtn" onclick="toggleDarkMode()">
                <i class="fas fa-moon"></i>
              </button>
              <button class="btn btn-outline-secondary" id="translateBtn" onclick="toggleTranslate()">
                <i class="fas fa-language"></i>
              </button>
            </div>
          </div>
        </nav>
      </header>
      
      <style>
      .dark-mode {
        background-color: #333 !important;
        color: #fff !important;
      }
      
      .dark-mode .navbar {
        background-color: #222 !important;
      }
      
      .dark-mode .nav-link {
        color: #fff !important;
      }
      
      .dark-mode .navbar-brand {
        color: #fff !important;
      }
      </style>
      
      <script>
      function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const navbar = document.querySelector('.navbar');
        navbar.classList.toggle('navbar-dark');
        navbar.classList.toggle('navbar-light');
      }
      
      function toggleTranslate() {
        // Add translation functionality here
        console.log('Translation toggle clicked');
      }
      </script>
    <main>

    </main>
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
